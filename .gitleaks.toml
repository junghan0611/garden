title = "notes.junghanacs.com gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''node_modules''',
  '''\.git''',
  '''static/images/.*''',
  '''public/images/.*''',
  '''.*\.log''',
]

# 예제/문서용 허용 패턴
regexes = [
  '''(?i)example|placeholder|your[-_]?api[-_]?key|xxx+|test[-_]?key''',
]

# ============================================================
# AI/LLM API Keys
# ============================================================

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''(?i)sk-ant-[a-z0-9]{2,}-[a-zA-Z0-9_-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''(?i)sk-[a-zA-Z0-9]{20,}T3BlbkFJ[a-zA-Z0-9]{20,}'''
keywords = ["sk-"]

[[rules]]
id = "openai-project-key"
description = "OpenAI Project API Key"
regex = '''sk-proj-[a-zA-Z0-9_-]{20,}'''
keywords = ["sk-proj-"]

[[rules]]
id = "google-ai-api-key"
description = "Google AI/Gemini API Key"
regex = '''AIza[0-9A-Za-z_-]{35}'''
keywords = ["AIza"]

[[rules]]
id = "groq-api-key"
description = "Groq API Key"
regex = '''gsk_[a-zA-Z0-9]{20,}'''
keywords = ["gsk_"]

[[rules]]
id = "mistral-api-key"
description = "Mistral API Key"
regex = '''(?i)(mistral[_-]?api[_-]?key|MISTRAL_API_KEY)\s*[=:]\s*['"]?([a-zA-Z0-9]{20,})['"]?'''
secretGroup = 2

[[rules]]
id = "huggingface-token"
description = "HuggingFace Token"
regex = '''hf_[a-zA-Z0-9]{20,}'''
keywords = ["hf_"]

[[rules]]
id = "replicate-api-token"
description = "Replicate API Token"
regex = '''r8_[a-zA-Z0-9]{20,}'''
keywords = ["r8_"]

# ============================================================
# Korean Services
# ============================================================

[[rules]]
id = "naver-api-key"
description = "Naver API Key"
regex = '''(?i)(naver[_-]?(?:client[_-]?)?(?:id|secret|key))\s*[=:]\s*['"]?([a-zA-Z0-9]{10,})['"]?'''
secretGroup = 2

[[rules]]
id = "kakao-api-key"
description = "Kakao API Key"
regex = '''(?i)(kakao[_-]?(?:rest[_-]?)?(?:api[_-]?)?key)\s*[=:]\s*['"]?([a-zA-Z0-9]{20,})['"]?'''
secretGroup = 2

# ============================================================
# Generic Patterns (High Entropy Required)
# ============================================================

[[rules]]
id = "generic-secret-assignment"
description = "Generic secret assignment pattern"
regex = '''(?i)(password|passwd|pwd|secret|token|api[_-]?key|auth[_-]?token|access[_-]?token|private[_-]?key)\s*[=:]\s*['"]([a-zA-Z0-9/+=_-]{16,})['"]'''
secretGroup = 2
entropy = 3.5

[[rules]]
id = "env-secret"
description = "Environment variable secret"
regex = '''(?i)export\s+([\w]+(?:SECRET|TOKEN|KEY|PASSWORD|PASSWD|PWD)[\w]*)\s*=\s*['"]?([a-zA-Z0-9/+=_-]{8,})['"]?'''
secretGroup = 2
entropy = 3.0

[[rules]]
id = "http-token-pattern"
description = "HTTP Token Pattern (legacy secretlint)"
regex = '''\w+_HTTP_TOKEN\s*=\s*['"]([a-zA-Z0-9]{20,})['"]'''
secretGroup = 1

# ============================================================
# Connection Strings
# ============================================================

[[rules]]
id = "database-url"
description = "Database connection string with credentials"
regex = '''(?i)(mysql|postgres|postgresql|mongodb|redis|amqp):\/\/[^:]+:([^@]+)@'''
secretGroup = 2

[[rules]]
id = "smtp-credentials"
description = "SMTP credentials in URL"
regex = '''(?i)smtp:\/\/[^:]+:([^@]+)@'''
secretGroup = 1

# ============================================================
# Private Keys (PEM format)
# ============================================================

[[rules]]
id = "private-key-pem"
description = "Private Key in PEM format"
regex = '''-----BEGIN\s+(?:RSA\s+)?PRIVATE\s+KEY-----'''
keywords = ["BEGIN", "PRIVATE", "KEY"]

[[rules]]
id = "ssh-private-key"
description = "SSH Private Key"
regex = '''-----BEGIN\s+OPENSSH\s+PRIVATE\s+KEY-----'''
keywords = ["OPENSSH", "PRIVATE"]
